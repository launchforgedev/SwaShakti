<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seller sign in | Namma Angadi</title><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-4">
<main class="mx-auto mt-12 max-w-md rounded-xl bg-white p-6 shadow">
    <a href="index.html" class="text-sm text-emerald-800 underline">← Buyer home</a>
    <h1 class="mt-4 text-2xl font-bold">Seller sign in</h1>
    <p class="mt-1 text-sm text-slate-600">Use the mobile number and password you registered with.</p>
    <form id="loginForm" class="mt-5 space-y-3">
        <input id="phone" required type="tel" autocomplete="username" class="w-full rounded border p-3" placeholder="Mobile number">
        <input id="password" required type="password" autocomplete="current-password" class="w-full rounded border p-3" placeholder="Password">
        <button id="loginButton" type="submit" class="w-full rounded bg-emerald-700 p-3 font-semibold text-white">Sign in</button>
    </form>
    <p id="loginStatus" role="status" class="mt-3 text-sm"></p>
    <p class="mt-4 text-sm">New to Namma Angadi? <a href="onboarding.html" class="text-emerald-800 underline">Create a seller account</a></p>
</main>
<script src="js/login.js"></script>
</body>
</html>
